comparisons:
  reference: Control_Vehicle
  target: TBI_Vehicle
  covariates: [batch]
  minimum_cells_per_pseudobulk: 20
  minimum_replicates_per_condition: 3
  allowed_annotation_confidence: [High, Medium]
  exclude_celltypes: [Unresolved, Ambiguous, Doublet-like]
  fdr_threshold: 0.05
  logfc_display_threshold: 0.5

pathways:
  gmt_path: null
  collection: H
  minimum_size: 10
  maximum_size: 500

advanced_modules:
