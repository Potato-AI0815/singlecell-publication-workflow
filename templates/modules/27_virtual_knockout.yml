virtual_knockout:
  enabled: true
  backend: sctenifoldknk
  target_genes: [REQUIRED_GENE]
  targets_path: null
  maximum_targets: 20
  allow_large_screen: false
  subset_column: cell_type_l1
  subset_values: [REQUIRED_COHERENT_CELL_TYPE]
  allow_all_cells: false
  condition_column: condition
  baseline_conditions: [REQUIRED_WT_OR_CONTROL_CONDITION]
  require_baseline_condition_when_multiple: true
  allowed_annotation_confidence: [High, Medium]
  assay: RNA
  analysis_unit: sample_stratified_consensus
  minimum_cells_per_sample: 500
  maximum_cells_per_sample: 5000
  minimum_eligible_samples: 2
  minimum_target_expressing_fraction: 0.05
  minimum_target_expressing_cells: 20
  subsampling_repeats: 3
  subsampling_fraction: 0.8
  maximum_pooled_cells: 10000
  minimum_balanced_cells_per_sample: 100
  gene_universe_method: variable_features
  gene_universe_path: null
  minimum_genes: 500
  maximum_genes: 2500
  minimum_global_detection_fraction: 0.01
  minimum_detection_fraction: 0.01
  minimum_sample_fraction_for_gene: 0.5
  variance_estimation_maximum_cells: 5000
  exclude_gene_patterns: ["^MT-", "^RPL", "^RPS", "^HB[AB]"]
  prior_network_path: null
  n_networks: 10
  cells_per_network: 500
  principal_components: 3
  network_quantile: 0.9
  symmetric: false
  scale_scores: true
  directionality_lambda: 0
  tensor_rank: 3
  tensor_max_iter: 1000
  tensor_max_error: 1.0e-5
  tensor_decimal_places: 3
  manifold_dimensions: 2
  workers: 4
  fdr_threshold: 0.05
  minimum_repeat_recurrence: 0.5
  minimum_sample_recurrence: 0.5
  network_top_genes: 50
  network_edge_quantile: 0.97
  minimum_edge_recurrence: 0.5
  similarity_top_genes: 100
  gmt_path: null
  pathway_collection: H
  minimum_pathway_query_genes: 10
  minimum_pathway_overlap: 3
  save_full_backend_objects: false
