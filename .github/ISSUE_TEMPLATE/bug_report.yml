name: Bug report
description: Report a reproducible workflow failure
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version/commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and R version
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage/module
      options: [preflight, import, QC, normalization, integration, annotation, markers, composition, pseudobulk, enrichment, figures, final-QA, CNA, CellChat, trajectory, NMF, hdWGCNA, spatial, drug-response, virtual-knockout]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error and relevant log excerpt
      description: Remove private paths and patient information.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
